#
# Options of "scm migrate-to-git -m <this file>": every supported property with its
# default. Uncomment and change what you need.
#

# User name and email address for the default git user if not defined
# by the RTC check-in information
#
#user.email=rtc2git@rtc.to
#user.name=RTC 2 git

# Optional - Maps EWM users to git identities. One entry per line:
#   <EWM user ID or full name> = Git Name <email@example.com>
# Lines starting with # are ignored; keys are matched case-insensitively.
#
#user.mapping.file=users.txt

# Optional - Domain used to build <userId>@<domain> when an EWM user has no
# email address (otherwise user.email is used)
#
#user.email.domain=example.com

# Optional - Time zone of commit and tag dates (default: the system time zone)
#
#commit.timezone=Europe/Zurich

# Optional - Every change set becomes exactly one commit, even when it changes no
# file content (for example property-only changes). Set to false to skip such
# change sets instead.
#
#commit.empty.changesets=true

# Optional - Adds an "EWM-ChangeSet: <uuid>" trailer to each commit message. The
# trailer links commits back to EWM and lets an interrupted migration resume
# without duplicating commits; disable only if you do not need either.
#
#commit.changeset.trailer=true

# Optional - When resuming, change sets that an interrupted run accepted into
# the target workspace but did not commit are discarded again (scm discard),
# so they are migrated properly. Set to false to stop and handle them yourself.
#
#resume.discard.pending=true

# Optional - Files that are versioned in EWM but match a .gitignore pattern (for
# example one translated from a .jazzignore) are committed anyway, like
# "git add --force". Only scm metadata and the exclusions configured with
# global.gitignore.entries and ignore.file.extensions stay untracked. This relies
# on nothing but the migration writing to the sandbox.
#
#commit.force.add.ignored=true

# Optional - Generate .gitattributes from the EWM file properties so a checkout
# reproduces the bytes "scm load" writes: line delimiter None/CR -> -text,
# LF -> text eol=lf, CRLF -> text eol=crlf, Platform -> text, non-text content
# types -> binary. Lines from the "gitattributes" property stay in front of the
# generated block. The EWM executable flag becomes the git file mode.
#
#gitattributes.from.ewm=true

# Optional - Also add working-tree-encoding=<encoding> for text files that EWM
# stores in an encoding other than UTF-8 (content is then stored as UTF-8 in git)
#
#gitattributes.working-tree-encoding=false

# Optional - Keep folders that are empty in EWM by adding an empty .gitkeep to
# git (only in git, never in the sandbox)
#
#keep.empty.folders=false

# Optional - z/OS members (files with an EWM language definition or in a zFolder)
# get "zos-working-tree-encoding=<code page> git-encoding=utf-8" in the generated
# .gitattributes, so Git on z/OS checks them out in EBCDIC. A member's own
# mvsCodePage property wins over this default; "none" writes no z/OS encodings.
#zos.codepage=IBM-1047

# Optional - Write .ewm/zos-metadata.json (language definition, build variable
# overrides and flags of each member, data set definition of each zFolder) in every
# commit where it changes. Input for dbb-app.yaml (ewm2zbuilder app / layout). Only
# written when the sandbox has z/OS metadata.
#zos.metadata=true

# Optional - Git LFS. Files larger than lfs.threshold (bytes, or with k/m suffix;
# 0 = off) when they are committed, and files matching lfs.patterns (.gitattributes
# patterns, separated by ;), are committed as LFS pointers; their content goes to
# the LFS object store of the repository (.git/lfs/objects, shared by the worktrees
# of other streams). A file that went to LFS because of its size stays there while
# it exists. Push the content with git-lfs: git lfs push --all <remote>.
#lfs.threshold=50m
#lfs.patterns=*.zip;*.jar;*.ear

# Optional - What to do when a change set cannot be accepted because earlier
# change sets are missing (a "gap"). By default the migration stops so the
# history is not falsified. With true, the missing change sets are accepted
# together with the requested one and end up in a single commit.
#
#rtc.accept.missing.changesets=false

# Optional - Encoding used to read and write .gitignore, .gitattributes and the
# user mapping file (default UTF-8)
#
#file.encoding=UTF-8

# Optional, defines a baseline name filter
#
# Here you define a regex for baselines that should be tagged in git.
# By default no tags are created.
#
# Example for all baselines
# rtc.baseline.include=^(.*)$
#
#rtc.baseline.include=

# Optional, defines a snapshot name filter
#
# Snapshots (baseline sets) owned by the migrated stream whose name matches
# become annotated tags named <rtc.snapshot.tag.prefix><snapshot name>, placed on
# the commit where the last of their baselines is migrated. By default no
# snapshots are tagged.
#
# Example for all snapshots
# rtc.snapshot.include=^(.*)$
#
#rtc.snapshot.include=
#rtc.snapshot.tag.prefix=snapshot/

# Optional, defines a work item number format to apply on each work item bound to
# the specific RTC changeset (if any)
#
# EWM's Git integration links work items to pushed commits whose message contains
# #<number> (or a keyword such as "task <number>"); a bare number is not recognized.
# Use #%s if the repository will be registered in EWM (docs/ewm-git-integration.md).
#
# In case you have migrated your workitems to another issue system (like jira/github/bitbucket)
# by using rtc2jira, you can define a prefix for the commit-message, in order that previously
# linked rtc commits get linked to the new issue system.
#
# Example for a Jira project: AP- (Project has the key AP and is followed by a dash)
# rtc.workitem.number.format=AP-%s
#
# For more detailed information about smart commits see:
# https://confluence.atlassian.com/jiracloud/processing-jira-issues-with-commit-messages-740098538.html
#
#rtc.workitem.number.format=%s

# Optional, defines the delimiter between multiple formatted RTC work item numbers. The default is
# a single space if not defined.
#
#rtc.workitem.number.delimiter=

# Optional, format of each work item in the third part of the commit message
# (commit.message.format): %1s is the number, %2s the summary. Multiple work items
# are separated by rtc.workitem.text.delimiter (default: a line break).
#
#rtc.workitem.text.format=%1s %2s
#rtc.workitem.text.delimiter=

# Optional, format of the change set comment: %1s is the comment, %2s the summary of
# the first work item. With rtc.changeset.comment.substitute=true, a change set
# without comment uses the work item summary instead.
#
#rtc.changeset.comment.format=%1s
#rtc.changeset.comment.substitute=false

# Optional commit message search/replace pairs being applied to to commit comment before the
# actual commit. The entries have to be in pairs of commit.message.regex.X/commit.message.replacement.X
# where X must be a unique decimal number.
#
#commit.message.regex.1=^(.*)$
#commit.message.replacement.1=$1

# Optional, defines the final commit message format: %1s is the formatted work item
# numbers (rtc.workitem.number.*), %2s the change set comment after rtc.changeset.comment.*
# and the commit.message.regex.* replacements, %3s the formatted work items
# (rtc.workitem.text.*). The result is trimmed; the EWM-ChangeSet trailer follows it.
#
# Example with the work items in the message body:
# commit.message.format=%1s %2s%n%n%3s
#
#commit.message.format=%1s %2s

# Optional, specifies the line(s) which are added to .gitattributes
# Define a semicolon-separated list of lines
#
# Example:
# gitattributes=# handle text files; * text=auto; *.sql text
#
#gitattributes=

# Leave files out of git entirely (they stay untracked; see lfs.* to keep large files)
# Define a semicolon-separated list of extensions to be generally ignored
#
# Example:
# ignore.file.extensions=.zip; .jar; .exe; .dll
#
#ignore.file.extensions=

# Optional: global .gitignore entries
# Define a semicolon-separated list of additional .gitignore entries being added
#
# Example:
# global.gitignore.entries=/projectX/WebContent/node_modules; *.ignored
#
#global.gitignore.entries=

# Maximum number of streams to open at a time. Open packs count against the process limits
#
#packedgitopenfiles=128

# Maximum number bytes of heap memory to dedicate to caching pack file data
#
#packedgitlimit=10m

# Size in bytes of a single window read in from the pack file
#
#packedgitwindowsize=8k

# Enables use of Java NIO virtual memory mapping for windows; false reads entire window
# into a byte[] with standard read calls
#
#packedgitmmap=false

# maximum number of bytes to cache in delta base cache for inflated, recently accessed
# objects, without delta chains
#
#deltabasecachelimit=10m

# new byte limit for objects that must be streamed. Objects smaller than this size can be
# obtained as a contiguous byte array, while objects bigger than this size are streamed
# (at most a quarter of the Java heap)
#
#streamfilethreshold=50m

# Optional git configuration of the new repository: git.config.<section>.<key>=<value>
# (no subsections). core.ignoreCase=false, core.autocrlf (input; true on Windows) and
# push.default=simple are always set.
#
# Example:
# git.config.core.longpaths=true
#
