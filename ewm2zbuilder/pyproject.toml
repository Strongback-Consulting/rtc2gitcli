[project]
name = "ewm2zbuilder"
version = "0.1.0"
description = "Convert an EWM/RTC z/OS system definition export into zBuilder YAML for IBM DBB"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
ewm2zbuilder = "ewm2zbuilder.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ewm2zbuilder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
